<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - الصفحة غير موجودة | ASM للاستشارات الإدارية</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/assets/images/logo.png" />
    <style>
      :root {
        --color-primary: #6366f1;
        --color-primary-dark: #4f46e5;
        --color-text: #1e293b;
        --color-text-muted: #64748b;
        --color-bg: #ffffff;
        --font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-text: #f1f5f9;
          --color-text-muted: #94a3b8;
          --color-bg: #0f172a;
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-family);
        background: var(--color-bg);
        color: var(--color-text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }

      .error-container {
        max-width: 500px;
      }

      .error-code {
        font-size: 8rem;
        font-weight: 800;
        background: linear-gradient(
          135deg,
          var(--color-primary),
          var(--color-primary-dark)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 1rem;
      }

      .error-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
      }

      .error-message {
        color: var(--color-text-muted);
        margin-bottom: 2rem;
        line-height: 1.6;
      }

      .error-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.875rem 2rem;
        background: linear-gradient(
          135deg,
          var(--color-primary),
          var(--color-primary-dark)
        );
        color: white;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 1rem;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .error-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
      }

      .error-links {
        margin-top: 2rem;
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .error-links a {
        color: var(--color-primary);
        text-decoration: none;
        font-size: 0.875rem;
      }

      .error-links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-title">الصفحة غير موجودة</h1>
      <p class="error-message">
        عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها. يرجى التحقق من
        الرابط أو العودة للصفحة الرئيسية.
      </p>
      <a href="/" class="error-btn">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        العودة للرئيسية
      </a>
      <div class="error-links">
        <a href="/services">خدماتنا</a>
        <a href="/about">من نحن</a>
        <a href="/contact">تواصل معنا</a>
      </div>
    </div>
  </body>
</html>
